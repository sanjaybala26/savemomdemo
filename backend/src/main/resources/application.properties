# ==============================================================================
# CareQueue Spring Boot Backend Configuration (Phase 1)
# ==============================================================================

# HTTP server port (defaults to 8080, override with SERVER_PORT)
server.port=${SERVER_PORT:8080}

# Application name identifier
spring.application.name=appointment-queue-backend

# ==============================================================================
# MySQL Database Connection (Configured via Environment Variables)
# ==============================================================================
# Default connects to MySQL on localhost:3306 with database appointment_queue_db
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:appointment_queue_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# Flyway Database Migrations
# ==============================================================================
# Flyway runs automatically on startup to keep schema versioned and synchronized
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==============================================================================
# CORS (Cross-Origin Resource Sharing)
# ==============================================================================
# Allows requests from local React development server
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ==============================================================================
# JWT Authentication (Phase 2)
# ==============================================================================
app.jwt.secret=${JWT_SECRET:carequeue-super-secret-jwt-signing-key-for-development-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==============================================================================
# Application Timezone (Phase 4 Live Slot Validation)
# ==============================================================================
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# ==============================================================================
# Role Registration Policies (Phase 2)
# ==============================================================================
# In production, set to false so ADMIN accounts cannot be registered publicly
app.auth.allow-admin-registration=${ALLOW_ADMIN_REGISTRATION:true}


